[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outreach"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["platformdirs>=4"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
outreach = "outreach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]